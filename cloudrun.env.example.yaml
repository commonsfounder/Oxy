SUPABASE_URL: "https://your-project.supabase.co"
SUPABASE_KEY: "your-supabase-service-key"
OPENAI_API_KEY: "set-via-secret-manager"
OXY_BRAIN_PROVIDER: "openai"
OXY_OPENAI_MODEL: "gpt-5.6-luna"
OXY_OPENAI_FAST_MODEL: "gpt-5.6-luna"
# Optional Gemini route. If selected, also set GEMINI_API_KEY and OXY_GEMINI_MODEL.
# GEMINI_API_KEY: "set-via-secret-manager"
# OXY_GEMINI_MODEL: "gemini-2.5-flash"
OXY_LIVE_MODEL: "gemini-live-2.5-flash-preview"
# Explicit cheap models to avoid accidental 3.5-flash (which is ~3x more expensive)
# GOOGLE_GENAI_USE_ENTERPRISE: "true"
# GOOGLE_CLOUD_PROJECT: "your-gcp-project-id"
# GOOGLE_CLOUD_LOCATION: "us-central1"
OXY_SESSION_SECRET: "replace-with-a-long-random-secret"
# 32-byte hex key for encrypting connector tokens at rest (P0: REQUIRED in production, no plaintext fallback)
OXY_TOKEN_ENCRYPTION_KEY: ""
TIMEZONE: "Europe/London"
# Process timezone for Date math (must match TIMEZONE). Also set in the Dockerfile.
TZ: "Europe/London"
GMAIL_CLIENT_ID: ""
GMAIL_CLIENT_SECRET: ""
STRIPE_SECRET_KEY: ""
STRIPE_PUBLISHABLE_KEY: ""
STRIPE_WEBHOOK_SECRET: ""
TELEGRAM_API_ID: ""
TELEGRAM_API_HASH: ""
# Millie's own communication identity — her email address and phone number, distinct
# from the user's. Neither is provisioned until these are set.
#
# MILLIE_EMAIL_DOMAIN must be a domain verified in the Resend account, with inbound
# receiving pointed at POST /webhooks/millie-email. Until it is set, Millie's email
# handle falls back to a placeholder domain that cannot actually send.
MILLIE_EMAIL_DOMAIN: ""
# Which telecom vendor provisions NEW numbers. Existing numbers keep being driven by
# whichever provider issued them (millie_identity_handles.provider), so changing this
# does not strand numbers already in the field — see connectors/phone-provider.js.
MILLIE_PHONE_PROVIDER: "twilio"
# UK mobile (+447) is the number type worth buying: businesses text it back, application
# forms accept it, and it needs only government ID with an address anywhere in the world —
# unlike UK local numbers, which require a UK address with proof. Every UK long code must
# also be attached to an approved Twilio UK Regulatory Compliance bundle before messaging
# or voice works at all.
TWILIO_ACCOUNT_SID: ""
TWILIO_AUTH_TOKEN: ""
TWILIO_PHONE_NUMBER: ""
TWILIO_NUMBER_COUNTRY: "GB"
SPOTIFY_CLIENT_ID: ""
SPOTIFY_CLIENT_SECRET: ""
SPOTIFY_REFRESH_TOKEN: ""
# Structured travel inventory. Self-serve at duffel.com — a duffel_test_* token returns
# fictional "Duffel Airways"/test-hotel inventory and is marked as such in every result;
# a duffel_live_* token returns real flight fares immediately. Without it, travel falls back
# to grounded web search, which is honest about being evidence rather than inventory.
#
# FLIGHTS and STAYS (hotels) are NOT the same unlock, verified against Duffel's own docs.
# A live token gets real flights the moment it exists. Real hotel inventory needs Stays
# access requested and approved SEPARATELY at duffel.com/contact-us — it is not self-serve
# and does not come with a flights signup. Until approved, hotel searches with a live token
# fail with a distinct "not yet approved for Stays" message (flights are unaffected); with
# a test token, hotel searches work immediately against Duffel's fixed test-hotel data.
DUFFEL_ACCESS_TOKEN:
TRANSPORT_API_APP_ID: ""
TRANSPORT_API_APP_KEY: ""
GOOGLE_MAPS_API_KEY: ""
APNS_KEY_ID: ""
APNS_TEAM_ID: ""
APNS_BUNDLE_ID: "ai.oxy.app"
APNS_PRIVATE_KEY: ""
APNS_USE_SANDBOX: "true"
HOME_ASSISTANT_URL: ""
HOME_ASSISTANT_TOKEN: ""
