# fly.toml app configuration file generated for milgrain-live-2026 on 2026-08-16T09:14:13+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'milgrain-live-2026'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_URL = 'https://milgrain-live-2026.fly.dev'
  NODE_ENV = 'production'
  TZ = 'Europe/London'
  # Per-phase browser-task timing (goto/settle/extract/screenshot/model-decide/action) to
  # stderr, gated by connectors/browser-task.js's own `timed()` helper — normally off, turned
  # on here specifically to get real evidence on a real stall (2026-08-26: 8 steps completed
  # in 45s, then one single step froze for 86s before the hard timeout fired) instead of
  # guessing at VM sizing with no data. Safe to leave on; it only adds console.warn lines.
  OXY_BROWSER_TIMING = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '60s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
