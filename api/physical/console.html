<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Adam physical runtime</title>
<style>
body{font:15px/1.5 system-ui;margin:0;background:#121518;color:#e9ecef}header{padding:20px 28px;border-bottom:1px solid #343a40;display:flex;gap:20px;align-items:center}h1{font-size:20px;margin:0}small{color:#aab4bf}.pill{border:1px solid #6f8a9d;padding:2px 8px;border-radius:20px}main{padding:24px 28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}section{background:#1c2227;border:1px solid #343a40;border-radius:10px;padding:16px;min-height:120px}h2{font-size:16px;margin:0 0 10px}pre{font:12px/1.45 ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;max-height:440px;overflow:auto}button{background:#dcaa55;color:#1b160e;border:0;border-radius:6px;padding:9px 14px;cursor:pointer}input{padding:9px;background:#101315;color:white;border:1px solid #66717b;border-radius:6px}form{display:flex;gap:8px;flex-wrap:wrap}.sim{color:#f6b969}.real{color:#8dd7a4}
</style>
<header><h1>Adam physical runtime</h1><span id="environment" class="pill">Loading</span><small id="status">Connecting…</small></header>
<main>
<section><h2>Rooms and state</h2><pre id="rooms"></pre></section>
<section><h2>Devices</h2><pre id="devices"></pre></section>
<section><h2>Watches</h2><pre id="watches"></pre></section>
<section><h2>Recent actions</h2><pre id="actions"></pre></section>
<section><h2>Observations and provenance</h2><pre id="observations"></pre></section>
<section><h2>Events</h2><pre id="events"></pre></section>
<section><h2>Create simulated room and device</h2><form id="setup"><input id="roomName" placeholder="Room name" required><input id="deviceName" placeholder="Device ID" required><button>Create</button></form><pre id="setupResult"></pre></section>
<section><h2>Simulate observation</h2><form id="simulate"><input id="device" placeholder="Simulator device ID" required><input id="secret" type="password" placeholder="Device secret" required><input id="type" placeholder="Observation type" value="motion_detected" required><input id="value" placeholder="JSON value" value="true" required><button>Send</button></form><p id="result"></p></section>
</main>
<script>
const token=prompt('Adam admin token (leave blank for local default)')||'';
const headers=token?{'x-adam-admin-token':token}:{};
const format=(value)=>JSON.stringify(value,null,2);
async function refresh(){try{const response=await fetch('/v1/snapshot',{headers});if(!response.ok)throw Error((await response.json()).error);const data=await response.json();document.querySelector('#environment').textContent=data.environment;for(const key of ['rooms','devices','watches','actions','events'])document.getElementById(key).textContent=format(data[key]);document.getElementById('observations').textContent=data.observations.map(item=>'['+item.source.origin.toUpperCase()+'] '+format(item)).join('\n\n');for(const field of document.querySelectorAll('#setup input,#setup button,#simulate input,#simulate button'))field.disabled=data.environment==='production';document.querySelector('#status').textContent='Live · '+new Date().toLocaleTimeString();}catch(error){document.querySelector('#status').textContent=error.message}}
document.querySelector('#simulate').addEventListener('submit',async event=>{event.preventDefault();const device=document.querySelector('#device').value;const secret=document.querySelector('#secret').value;let value;try{value=JSON.parse(document.querySelector('#value').value)}catch{document.querySelector('#result').textContent='Value must be JSON';return}const response=await fetch('/v1/devices/'+encodeURIComponent(device)+'/observations',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+secret},body:JSON.stringify({protocolVersion:1,messageId:crypto.randomUUID(),timestamp:new Date().toISOString(),type:document.querySelector('#type').value,value})});document.querySelector('#result').textContent=response.ok?'Recorded as simulated':format(await response.json());refresh()});
document.querySelector('#setup').addEventListener('submit',async event=>{event.preventDefault();const roomResponse=await fetch('/v1/rooms',{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({name:document.querySelector('#roomName').value})});const room=await roomResponse.json();if(!roomResponse.ok){document.querySelector('#setupResult').textContent=format(room);return}const deviceResponse=await fetch('/v1/simulator/devices',{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({id:document.querySelector('#deviceName').value,roomId:room.id})});const registered=await deviceResponse.json();document.querySelector('#setupResult').textContent=deviceResponse.ok?'Room ID: '+room.id+'\nDevice secret (copy now): '+registered.secret:format(registered);if(deviceResponse.ok){document.querySelector('#device').value=registered.device.id;document.querySelector('#secret').value=registered.secret}refresh()});
async function stream(){try{const response=await fetch('/v1/stream',{headers});if(!response.ok)throw Error('Stream unavailable');const reader=response.body.getReader();for(;;){const packet=await reader.read();if(packet.done)break;refresh()}}catch{setTimeout(stream,3000)}}
refresh();stream();setInterval(refresh,10000);
</script></html>
