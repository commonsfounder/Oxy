name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run release:check
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: >
          xcodebuild -project OxyApp/OxyApp.xcodeproj -scheme OxyApp
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
